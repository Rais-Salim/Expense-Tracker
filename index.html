<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-white text-gray-800 min-h-screen">

    <!-- ===== HEADER ===== -->
    <header class="border-b border-gray-100 py-5 px-4">
      <div class="max-w-2xl mx-auto flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gray-800 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h1 class="text-lg font-semibold tracking-tight">Expense Tracker</h1>
      </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8 space-y-8">

      <!-- ===== BALANCE CARD ===== -->
      <section aria-labelledby="balance-heading">
        <div class="rounded-2xl bg-gray-800 text-white p-6 text-center">
          <p id="balance-heading" class="text-sm text-gray-400 uppercase tracking-widest mb-1">Saldo Saat Ini</p>
          <p id="balance" class="text-4xl font-bold tracking-tight mt-1">Rp 0</p>
        </div>

        <!-- ── Summary cards: Total Pemasukan & Total Pengeluaran ── -->
        <div class="grid grid-cols-2 gap-3 mt-3">

          <!-- Card: Total Pemasukan -->
          <div class="rounded-2xl border border-green-100 bg-green-50 p-5 flex flex-col gap-2">
            <!-- Icon -->
            <div class="w-8 h-8 rounded-lg bg-green-100 flex items-center justify-center self-start">
              <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
            </div>
            <!-- Label -->
            <p class="text-xs font-medium text-green-700 uppercase tracking-widest leading-none">
              Total Pemasukan
            </p>
            <!-- Amount -->
            <p id="total-income" class="text-xl font-bold income-text leading-tight">Rp 0</p>
          </div>

          <!-- Card: Total Pengeluaran -->
          <div class="rounded-2xl border border-red-100 bg-red-50 p-5 flex flex-col gap-2">
            <!-- Icon -->
            <div class="w-8 h-8 rounded-lg bg-red-100 flex items-center justify-center self-start">
              <svg class="w-4 h-4 text-red-600" fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
              </svg>
            </div>
            <!-- Label -->
            <p class="text-xs font-medium text-red-700 uppercase tracking-widest leading-none">
              Total Pengeluaran
            </p>
            <!-- Amount -->
            <p id="total-expense" class="text-xl font-bold expense-text leading-tight">Rp 0</p>
          </div>

        </div>
      </section>

      <!-- ===== ADD TRANSACTION FORM ===== -->
      <section aria-labelledby="form-heading">
        <h2 id="form-heading" class="text-sm font-semibold uppercase tracking-widest text-gray-400 mb-4">
          Tambah Transaksi
        </h2>

        <form id="transaction-form" novalidate class="space-y-4">

          <!-- Description -->
          <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
              Deskripsi
            </label>
            <input
              type="text"
              id="description"
              placeholder="Contoh: Gaji, Makan siang…"
              maxlength="60"
              class="input-field w-full rounded-xl border border-gray-200 px-4 py-3 text-sm
                     placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-800
                     focus:border-transparent transition"
            />
            <p id="description-error" class="error-msg mt-1 text-xs text-red-500 hidden">
              Deskripsi tidak boleh kosong.
            </p>
          </div>

          <!-- Amount -->
          <div>
            <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">
              Jumlah (Rp)
            </label>
            <input
              type="text"
              id="amount"
              inputmode="numeric"
              autocomplete="off"
              placeholder="0"
              class="input-field w-full rounded-xl border border-gray-200 px-4 py-3 text-sm
                     placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-800
                     focus:border-transparent transition"
            />
            <p id="amount-error" class="error-msg mt-1 text-xs text-red-500 hidden">
              Jumlah harus diisi dan tidak boleh nol.
            </p>
          </div>

          <!-- Type toggle -->
          <fieldset>
            <legend class="block text-sm font-medium text-gray-700 mb-2">Jenis Transaksi</legend>
            <div class="grid grid-cols-2 gap-3" role="group">
              <label class="type-label">
                <input type="radio" name="type" value="income" class="sr-only" checked />
                <span class="type-btn income-btn rounded-xl border-2 border-transparent py-3
                             flex items-center justify-center gap-2 text-sm font-medium cursor-pointer
                             transition-all select-none">
                  <span aria-hidden="true">＋</span> Pemasukan
                </span>
              </label>
              <label class="type-label">
                <input type="radio" name="type" value="expense" class="sr-only" />
                <span class="type-btn expense-btn rounded-xl border-2 border-transparent py-3
                             flex items-center justify-center gap-2 text-sm font-medium cursor-pointer
                             transition-all select-none">
                  <span aria-hidden="true">－</span> Pengeluaran
                </span>
              </label>
            </div>
          </fieldset>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full rounded-xl bg-gray-800 text-white py-3 text-sm font-semibold
                   hover:bg-gray-700 active:scale-95 transition-all"
          >
            Tambah Transaksi
          </button>

        </form>
      </section>

      <!-- ===== TRANSACTION HISTORY ===== -->
      <section aria-labelledby="history-heading">
        <div class="flex items-center justify-between mb-4">
          <h2 id="history-heading" class="text-sm font-semibold uppercase tracking-widest text-gray-400">
            Riwayat Transaksi
          </h2>
          <button
            id="clear-btn"
            class="text-xs text-gray-400 hover:text-red-500 transition hidden"
            aria-label="Hapus semua transaksi"
          >
            Hapus Semua
          </button>
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="text-center py-12 text-gray-400 text-sm">
          <svg class="w-10 h-10 mx-auto mb-3 opacity-30" fill="none" stroke="currentColor"
            stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          Belum ada transaksi.
        </div>

        <!-- Transaction list -->
        <ul id="transaction-list" class="space-y-2" role="list" aria-live="polite" aria-label="Daftar transaksi"></ul>
      </section>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="border-t border-gray-100 py-5 text-center text-xs text-gray-400 mt-4">
      Expense Tracker &copy; <span id="footer-year"></span>
    </footer>

    <!-- App logic -->
    <script src="script.js"></script>
  </body>
</html>
